name: Daily Full Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
      
      - name: Install Playwright browsers
        run: |
          playwright install

      - name: Run employees scraper
        run: |
          python src/watcalendars/watemployees.py

      - name: Run IOE groups scraper
        run: |
          python src/watcalendars/groups/groups_ioe.py

      - name: Run WCY groups scraper
        run: |
          python src/watcalendars/groups/groups_wcy.py
        
      - name: Run WEL groups scraper
        run: |
          python src/watcalendars/groups/groups_wel.py

      - name: Run WIG groups scraper
        run: |
          python src/watcalendars/groups/groups_wig.py

      - name: Run WIM groups scraper
        run: |
          python src/watcalendars/groups/groups_wim.py

      - name: Run WLO groups scraper
        run: |
          python src/watcalendars/groups/groups_wlo.py

      - name: Run WML groups scraper
        run: |
          python src/watcalendars/groups/groups_wml.py
      
      - name: Run WTC groups scraper
        run: |
          python src/watcalendars/groups/groups_wtc.py

      - name: Run IOE schedule scraper
        run: |
          python src/watcalendars/calendar_ioe.py

      - name: Run WCY schedule scraper
        run: |
          python src/watcalendars/calendar_wcy.py

      - name: Run WEL schedule scraper
        run: |
          python src/watcalendars/calendar_wel.py

      - name: Run WIG schedule scraper
        run: |
          python src/watcalendars/calendar_wig.py

      - name: Run WIM schedule scraper
        run: |
          python src/watcalendars/calendar_wim.py

      - name: Run WLO schedule scraper
        run: |
          python src/watcalendars/calendar_wlo.py

      - name: Run WML schedule scraper
        run: |
          python src/watcalendars/calendar_wml.py

      - name: Run WTC schedule scraper
        run: |
          python src/watcalendars/calendar_wtc.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'Github Actions Bot'
          git config --global user.email 'actions@github.com'
          git add db/employees.json db/groups_url/*.json db/schedules/*/*.docx db/calendars/*/*.ics
          git commit -m "Automated daily scrape" || echo "No changes to commit"
          git push || echo "No changes to push"
